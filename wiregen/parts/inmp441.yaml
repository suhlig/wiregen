id: inmp441
name: INMP441 I2S Microphone
package: board
style: pcb
color: "#1f6feb"        # the common blue breakout PCB
description: >-
  INMP441 I2S MEMS microphone breakout (6-pin). VDD is 3V3 only. Tie L/R to GND
  to select the left channel (leave it high for right). SCK is the bit clock
  (BCLK), WS the word select / frame clock (LRCLK), SD the serial data output.
  Pin order follows the common breakout: power and channel select first, then
  the three I2S lines.
width: 132
height: 108
pins:
  # single header along the edge that faces the host board
  - { name: VDD, side: right, signal: power, net: 3v3, dir: power, number: "1", label: "VDD (3V3)" }
  - { name: GND, side: right, signal: power, net: gnd, dir: power, number: "2" }
  - { name: L/R, side: right, signal: gpio, role: ctrl, number: "3" }
  - { name: SCK, side: right, signal: i2s, role: bck, dir: in, number: "4" }
  - { name: WS,  side: right, signal: i2s, role: lrck, dir: in, number: "5" }
  - { name: SD,  side: right, signal: i2s, role: dout, dir: out, number: "6" }
decorations:
  # the MEMS die and the sound port
  - { type: ic, at: [0.36, 0.52], w: 30, h: 30, label: "INMP441" }
  - { type: dot, at: [0.74, 0.52], r: 8 }
  # two mounting holes
  - { type: hole, at: [0.14, 0.16], r: 4 }
  - { type: hole, at: [0.14, 0.88], r: 4 }
