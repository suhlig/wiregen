id: inmp441
name: INMP441 I2S Microphone
package: board
style: pcb
shape: round
color: "#1f6feb"        # the common blue breakout PCB
description: >-
  INMP441 I2S MEMS microphone breakout (6-pin), on the common round blue PCB.
  VDD is 3V3 only. Tie L/R to GND to select the left channel (leave it high to
  select the right). SCK is the bit clock (BCLK), WS the word select / frame
  clock (LRCLK), SD the serial data output. The six pads sit in two rows of
  three across the board: the I2S clocks and channel select (SCK, WS, L/R)
  along one edge, the data line and power (SD, VDD, GND) along the opposite
  edge. The board has an alignment notch on the rim and no mounting holes.
width: 132
height: 132            # round board: square box, drawn as an inscribed circle
pins:
  # top row of three pads
  - { name: SCK, side: top, signal: i2s, role: bck, dir: in }
  - { name: WS,  side: top, signal: i2s, role: lrck, dir: in }
  - { name: "L/R", side: top, signal: gpio, role: ctrl }
  # bottom row of three pads
  - { name: SD,  side: bottom, signal: i2s, role: dout, dir: out }
  - { name: VDD, side: bottom, signal: power, net: 3v3, dir: power }
  - { name: GND, side: bottom, signal: power, net: gnd, dir: power }
decorations:
  # alignment notch on the rim, centred on the top edge
  - { type: notch, at: [0.5, 0.0], r: 11 }
  # the MEMS die (metal can) with its sound port
  - { type: ic, at: [0.5, 0.5], w: 46, h: 42 }
  - { type: dot, at: [0.5, 0.63], r: 4 }
  # the two SMD passives on the left flank
  - { type: resistor, at: [0.28, 0.40], w: 16, h: 7, rot: 90 }
  - { type: resistor, at: [0.28, 0.50], w: 16, h: 7, rot: 90 }
